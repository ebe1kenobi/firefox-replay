<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Harnais de test</title>
  <style>
    body { font: 12px sans-serif; display: flex; gap: 8px; margin: 0; height: 100vh; }
    #left { flex: 1; display: flex; flex-direction: column; padding: 4px; }
    iframe#page { flex: 1; border: 1px solid #888; }
    #right { width: 48%; overflow: auto; padding: 6px; border-left: 1px solid #ccc; }
    pre { white-space: pre-wrap; font-size: 11px; margin: 0; }
    .error { color: #c00; } .ok { color: #080; font-weight: bold; }
  </style>
  <script src="../ide/commands.js"></script>
  <script src="../ide/project.js"></script>
  <script src="../ide/engine.js"></script>
</head>
<body>
  <div id="left">
    <div>
      <button id="rec">Enregistrer</button>
      <button id="stop">Arrêter l'enregistrement</button>
      <button id="play">Rejouer l'enregistrement</button>
      <button id="auto">Test automatique</button>
      <span id="state"></span>
    </div>
    <iframe id="page" src="page.html"></iframe>
  </div>
  <div id="right">
    <h3>Commandes enregistrées</h3>
    <pre id="cmds"></pre>
    <h3>Journal</h3>
    <pre id="log"></pre>
  </div>
  <script src="harness.js"></script>
</body>
</html>
